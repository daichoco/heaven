name: Update Tokai report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: tokai-report-main
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check required secret
        env:
          FUZOKU_TOKAI_PASSWORD: ${{ secrets.FUZOKU_TOKAI_PASSWORD }}
        run: |
          if [[ -z "$FUZOKU_TOKAI_PASSWORD" ]]; then
            echo "::error::Set the repository Actions secret FUZOKU_TOKAI_PASSWORD before running this workflow."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install HTML formatter
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Chrome availability
        run: google-chrome --version

      - name: Collect new Tokai reports
        env:
          FUZOKU_TOKAI_PASSWORD: ${{ secrets.FUZOKU_TOKAI_PASSWORD }}
        run: python src/tokai_fuzoku/collect_fuzoku_tokai.py

      - name: Generate Tokai HTML report
        env:
          FUZOKU_TOKAI_PASSWORD: ${{ secrets.FUZOKU_TOKAI_PASSWORD }}
        run: python src/tokai_fuzoku/generate_report_final.py

      - name: Commit and push updated report data
        run: |
          git ls-files --error-unmatch -- \
            data/tokai_fuzoku_reports.jsonl \
            docs/tokai_final_report.html > /dev/null
          git add -u -- \
            data/tokai_fuzoku_reports.jsonl \
            docs/tokai_final_report.html
          if git diff --cached --quiet; then
            echo "No tracked Tokai report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Tokai report data" \
            -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Could not push Tokai report updates after three attempts."
              exit 1
            fi
            echo "::warning::Push failed; fetching main and rebasing before retry."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Could not rebase Tokai report updates onto main. Resolve the conflict and rerun the workflow."
              exit 1
            fi
          done
