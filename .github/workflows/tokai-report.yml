name: Update Tokai report

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"

permissions:
  contents: write

concurrency:
  group: tokai-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUZOKU_TOKAI_PASSWORD: ${{ secrets.FUZOKU_TOKAI_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install HTML formatter
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect Tokai reports
        run: python src/tokai_fuzoku/collect_fuzoku_tokai.py

      - name: Generate Tokai report
        run: python src/tokai_fuzoku/generate_report_final.py

      - name: Commit updated report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/tokai_fuzoku_reports.jsonl \
            docs/tokai_final_report.html
          if ! git diff --cached --quiet; then
            git commit -m "Update Tokai report data"
          fi
