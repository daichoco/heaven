name: Update month schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: month-schedule-main
  cancel-in-progress: false

jobs:
  update-month-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check required secrets
        env:
          CITYHEAVEN_USER: ${{ secrets.CITYHEAVEN_USER }}
          CITYHEAVEN_PASS: ${{ secrets.CITYHEAVEN_PASS }}
        run: |
          missing=0
          for secret in CITYHEAVEN_USER CITYHEAVEN_PASS; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Set the repository Actions secret $secret before running this workflow."
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install HTML formatter
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect month schedule
        env:
          CITYHEAVEN_USER: ${{ secrets.CITYHEAVEN_USER }}
          CITYHEAVEN_PASS: ${{ secrets.CITYHEAVEN_PASS }}
        run: python src/cityheaven/cityheaven_month_schedule.py

      - name: Commit and push updated index
        run: |
          git ls-files --error-unmatch -- docs/index.html > /dev/null
          git add -u -- docs/index.html
          if git diff --cached --quiet; then
            echo "No tracked month schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update month schedule index" \
            -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Could not push month schedule updates after three attempts."
              exit 1
            fi
            echo "::warning::Push failed; fetching main and rebasing before retry."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Could not rebase month schedule updates onto main. Resolve the conflict and rerun the workflow."
              exit 1
            fi
          done
