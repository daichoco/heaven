name: Update NS senmon report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: ns-senmon-report-main
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check required secrets
        env:
          NS_SENMON_USER: ${{ secrets.NS_SENMON_USER }}
          NS_SENMON_PASS: ${{ secrets.NS_SENMON_PASS }}
        run: |
          missing=0
          for secret in NS_SENMON_USER NS_SENMON_PASS; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Set the repository Actions secret $secret before running this workflow."
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install HTML formatter
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect new NS senmon reports
        env:
          NS_SENMON_USER: ${{ secrets.NS_SENMON_USER }}
          NS_SENMON_PASS: ${{ secrets.NS_SENMON_PASS }}
        run: python src/ns_senmon/collect_ns_senmon.py

      - name: Match CityHeaven profiles
        run: python src/ns_senmon/match_cityheaven.py

      - name: Generate NS senmon HTML report
        run: python src/ns_senmon/generate_ns_senmon_report.py

      - name: Commit and push updated report data
        run: |
          git ls-files --error-unmatch -- \
            data/ns_senmon_reports.jsonl \
            data/ns_senmon_unmatched.json \
            data/ns_senmon_shop_search_cache.json \
            data/ns_senmon_profile_image_cache.json \
            docs/ns_senmon_report.html > /dev/null
          git add -u -- \
            data/ns_senmon_reports.jsonl \
            data/ns_senmon_unmatched.json \
            data/ns_senmon_shop_search_cache.json \
            data/ns_senmon_profile_image_cache.json \
            docs/ns_senmon_report.html
          if git diff --cached --quiet; then
            echo "No tracked NS senmon report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NS senmon report data" \
            -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Could not push NS senmon report updates after three attempts."
              exit 1
            fi
            echo "::warning::Push failed; fetching main and rebasing before retry."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Could not rebase NS senmon report updates onto main. Resolve the conflict and rerun the workflow."
              exit 1
            fi
          done
